# Migration 平台反向代理配置
# 域名: migration.bulgat.top

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name migration.bulgat.top;

    # 重定向到 HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS 配置
server {
    listen 443 ssl http2;
    server_name migration.bulgat.top;

    # DNS 解析器 - Docker 网络
    resolver 127.0.0.11 valid=30s ipv6=off;

    # SSL 证书配置 (Let's Encrypt 泛域名证书)
    ssl_certificate /etc/nginx/ssl/certs/_.bulgat.top.pem;
    ssl_certificate_key /etc/nginx/ssl/certs/_.bulgat.top.key;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 访问日志
    access_log /var/log/nginx/migration_ssl_access.log;
    error_log /var/log/nginx/migration_ssl_error.log;

    # 代理 Frontend 前端 UI
    location / {
        proxy_pass http://localhost:8088;
        proxy_http_version 1.1;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲设置
        proxy_buffering off;
    }

    # 代理 Diff 差异比对服务后端
    location ^~ /api/v1/diff {
        proxy_pass http://localhost:8091/api/v1/diff;
        proxy_http_version 1.1;

        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲设置
        proxy_buffering off;
    }

    # 代理 Admin API 管理中心后端
    location ^~ /api/ {
        proxy_pass http://localhost:8090/api/;
        proxy_http_version 1.1;

        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲设置
        proxy_buffering off;
    }
}
