version: '3.8'

services:
  # 数据库服务
  mysql:
    image: mysql:8.0
    container_name: migration-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-migration}
      MYSQL_USER: ${MYSQL_USER:-migration}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-migration}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # 缓存服务
  redis:
    image: redis:6.2
    container_name: migration-redis
    restart: always
    ports:
      - "6379:6379"

  # Diff服务
  diff:
    build:
      context: .
      dockerfile: Dockerfile.diff
    container_name: migration-diff
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-migration}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-migration}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-migration}
    depends_on:
      - mysql

  # 管理后台API服务
  admin-api:
    build:
      context: .
      dockerfile: Dockerfile.admin-api
    container_name: migration-admin-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-migration}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-migration}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-migration}
      DIFF_SERVICE_URL: http://diff:8081
    depends_on:
      - mysql
      - diff

  # 管理后台前端服务
  admin-ui:
    build:
      context: .
      dockerfile: Dockerfile.admin-ui
    container_name: migration-admin-ui
    restart: always
    ports:
      - "80:80"
    depends_on:
      - admin-api

volumes:
  mysql_data: