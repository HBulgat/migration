services:
  migration.admin.api:
    build:
      context: ../migration-admin/migration-admin-api
      dockerfile: Dockerfile
    image: hbulgat/migration.admin.api:latest
    container_name: migration.admin.api
    env_file:
      - .env
    ports:
      - "8090:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - MIGRATION_ADMIN_AUTH_USERNAME=${MIGRATION_ADMIN_AUTH_USERNAME}
      - MIGRATION_ADMIN_AUTH_PASSWORD=${MIGRATION_ADMIN_AUTH_PASSWORD}
      - MIGRATION_ADMIN_AUTH_JWT_SECRET=${MIGRATION_ADMIN_AUTH_JWT_SECRET}
      - MIGRATION_ADMIN_AUTH_INTERNAL_TOKEN=${MIGRATION_ADMIN_AUTH_INTERNAL_TOKEN}
      - MIGRATION_ADMIN_CONFIG_CENTER_SERVER_ADDR=${MIGRATION_ADMIN_CONFIG_CENTER_SERVER_ADDR}
      - MIGRATION_ADMIN_CONFIG_CENTER_NAMESPACE=${MIGRATION_ADMIN_CONFIG_CENTER_NAMESPACE}
      - MIGRATION_ADMIN_CONFIG_CENTER_USERNAME=${MIGRATION_ADMIN_CONFIG_CENTER_USERNAME}
      - MIGRATION_ADMIN_CONFIG_CENTER_PASSWORD=${MIGRATION_ADMIN_CONFIG_CENTER_PASSWORD}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - LOGGING_FILE_PATH=/app/logs/migration.admin.api
    #    extra_hosts:
    #      - "host.docker.internal:${HOST_IP}"
    volumes:
      - /var/log/myapp/migration.admin.api:/app/logs/migration.admin.api
    restart: always

  migration.diff.service:
    build:
      context: ../migration-diff-service
      dockerfile: Dockerfile
    image: hbulgat/migration.diff.service:latest
    container_name: migration.diff.service
    env_file:
      - .env
    ports:
      - "8091:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - MIGRATION_DIFF_AUTH_INTERNAL_TOKEN=${MIGRATION_DIFF_AUTH_INTERNAL_TOKEN}
      - MIGRATION_DIFF_CONFIG_CENTER_SERVER_ADDR=${MIGRATION_DIFF_CONFIG_CENTER_SERVER_ADDR}
      - MIGRATION_DIFF_CONFIG_CENTER_META_INFO_NAMESPACE=${MIGRATION_DIFF_CONFIG_CENTER_META_INFO_NAMESPACE}
      - MIGRATION_DIFF_CONFIG_CENTER_USERNAME=${MIGRATION_DIFF_CONFIG_CENTER_USERNAME}
      - MIGRATION_DIFF_CONFIG_CENTER_PASSWORD=${MIGRATION_DIFF_CONFIG_CENTER_PASSWORD}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - LOGGING_FILE_PATH=/app/logs/migration.diff.service
    #    extra_hosts:
    #      - "host.docker.internal:${HOST_IP}"
    volumes:
      - /var/log/myapp/migration.diff.service:/app/logs/migration.diff.service
    restart: always

  migration.admin.ui:
    build:
      context: ../migration-admin/migration-admin-ui
      dockerfile: Dockerfile
    image: hbulgat/migration.admin.ui:latest
    container_name: migration.admin.ui
    ports:
      - "8088:80"
    restart: always
    depends_on:
      - migration.admin.api
