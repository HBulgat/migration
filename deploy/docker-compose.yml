services:
  migration.admin.api:
    build:
      context: ../migration-admin/migration-admin-api
      dockerfile: Dockerfile
    image: migration.admin.api:latest
    container_name: migration.admin.api
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    restart: always

  migration.diff.service:
    build:
      context: ../migration-diff-service
      dockerfile: Dockerfile
    image: migration.diff.service:latest
    container_name: migration.diff.service
    env_file:
      - .env
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    restart: always

  migration.admin.ui:
    build:
      context: ../migration-admin/migration-admin-ui
      dockerfile: Dockerfile
    image: migration.admin.ui:latest
    container_name: migration.admin.ui
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    restart: always
    depends_on:
      - migration.admin.api
